# ─────────────────────────────────────────────────────────────
#  Configuración del sitio.  Cambia SOLO los valores de aquí.
#  Los textos de la interfaz (menú, botones, etiquetas) están
#  en _data/ui.yml, en español y en inglés.
# ─────────────────────────────────────────────────────────────

title:            "r0mato"
tagline:          "Offensive Security Research"
description:      "Writeups técnicos de vulnerabilidades reales en web y API. Investigación de seguridad ofensiva con metodología verificable y divulgación responsable."
url:              "https://r0mato.github.io"
baseurl:          ""
lang:             "es"
timezone:         "Europe/Madrid"

# Tu perfil
author:
  name:     "r0mato"
  role:     "Security Researcher · Bug Bounty Hunter"
  location: "España"
  email:    "curroalcaide2004@gmail.com"
  yeswehack: "r0mato"     # usuario de YesWeHack
  linkedin: ""            # p.ej. "francisco-alcaide"  (vacío = no se muestra)

# Métricas de la portada. Edita los números cuando cambien.
stats:
  - value: "+18"
    label_es: "Vulnerabilidades reportadas"
    label_en: "Vulnerabilities reported"
  - value: "12"
    label_es: "Reportes en YesWeHack"
    label_en: "Reports on YesWeHack"
  - value: "10"
    label_es: "Critical / High"
    label_en: "Critical / High"
  - value: "3"
    label_es: "Aceptadas y recompensadas"
    label_en: "Accepted and rewarded"

# Desglose por severidad que se pinta bajo las métricas
severity_breakdown:
  - level: critical
    count: 2
  - level: high
    count: 8
  - level: medium
    count: 2

# ── Jekyll ───────────────────────────────────────────────────
permalink: /writeups/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

sass:
  style: compressed

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "writeup"
      lang: "es"
  - scope:
      path: ""
    values:
      layout: "page"
      lang: "es"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - PUBLICAR.md
  - plantilla-writeup.md
  - nuevo-writeup.sh
  - SCOPE.md
  - _sesion
  - _oob
  - _ritmo
  - .gitignore
