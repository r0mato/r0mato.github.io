<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand__mark">r0</span>
      <span class="brand__text">
        {{ site.title }}
        <small>{{ site.tagline }}</small>
      </span>
    </a>

    <nav class="nav" id="nav">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Inicio</a>
      <a href="{{ '/writeups/' | relative_url }}" {% if page.url contains '/writeups' %}aria-current="page"{% endif %}>Writeups</a>
      <a href="{{ '/metodologia/' | relative_url }}" {% if page.url contains '/metodologia' %}aria-current="page"{% endif %}>Metodología</a>
      <a href="{{ '/sobre-mi/' | relative_url }}" {% if page.url contains '/sobre-mi' %}aria-current="page"{% endif %}>Sobre mí</a>
      <a href="{{ '/contacto/' | relative_url }}" {% if page.url contains '/contacto' %}aria-current="page"{% endif %}>Contacto</a>
    </nav>

    <button class="icon-btn" id="theme-toggle" aria-label="Cambiar tema">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>

    <button class="icon-btn nav-toggle" id="nav-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="nav">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
  </div>
</header>
