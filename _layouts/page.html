---
layout: default
---
<div class="wrap page-head">
  {% if page.eyebrow %}<span class="eyebrow">{{ page.eyebrow }}</span>{% endif %}
  <h1>{{ page.title }}</h1>
  {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
</div>
<div class="wrap page-body">
  {%- comment -%} wide: true en el front matter suelta el limite de 760px {%- endcomment -%}
  <div class="prose{% if page.wide %} prose--wide{% endif %}">
    {{ content }}
  </div>
</div>
