---
layout: default
---
<div class="wrap page-head">
  {% if page.eyebrow %}<span class="eyebrow">{{ page.eyebrow }}</span>{% endif %}
  <h1>{{ page.title }}</h1>
  {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
</div>
<div class="wrap page-body">
  <div class="prose">
    {{ content }}
  </div>
</div>
