<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 360" width="1150" height="360" role="img"><rect width="1150" height="360" fill="#0d1526"/><defs><marker id="f-8b9bb4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b9bb4"/></marker><marker id="f-fb7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb7185"/></marker><marker id="f-34d399" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34d399"/></marker><marker id="f-60a5fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/></marker><marker id="f-fbbf24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker></defs><text x="40" y="40" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15" font-weight="600" text-anchor="start">A secret that travels to the browser stops being a secret</text><rect x="40" y="76" width="230" height="80" rx="11" fill="#111a2d" stroke="#60a5fa" stroke-opacity=".6"/><text x="155" y="112" fill="#60a5fa" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">SERVER</text><text x="155" y="134" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" text-anchor="middle">secret_key = …</text><rect x="460" y="76" width="250" height="80" rx="11" fill="#111a2d" stroke="#34d399" stroke-opacity=".6"/><text x="585" y="112" fill="#34d399" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">YOUR BROWSER</text><text x="585" y="134" fill="#8b9bb4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">signs the request with the key</text><rect x="460" y="220" width="250" height="80" rx="11" fill="#111a2d" stroke="#fb7185" stroke-opacity=".6"/><text x="585" y="256" fill="#fb7185" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">THE ATTACKER</text><text x="585" y="278" fill="#8b9bb4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">an equally valid signature, with no account</text><path d="M270 108 L455 108" stroke="#34d399" stroke-width="1.8" marker-end="url(#f-34d399)"/><text x="362" y="98" fill="#34d399" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" text-anchor="middle">sends the .js file</text><text x="362" y="128" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" text-anchor="middle">with the key inside</text><path d="M270 140 L455 252" stroke="#fb7185" stroke-width="1.8" marker-end="url(#f-fb7185)"/><text x="58" y="236" fill="#fb7185" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" text-anchor="start">downloads the SAME file</text><text x="58" y="254" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" text-anchor="start">and reads the SAME key</text><rect x="790" y="118" width="320" height="140" rx="11" fill="#111a2d" stroke="#22304d" stroke-opacity=".6"/><text x="810" y="148" fill="#dbe4f3" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" text-anchor="start">POST /auth/token</text><text x="810" y="172" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" text-anchor="start">{"signature": "…"}</text><path d="M810 190 L1090 190" stroke="#22304d"/><text x="810" y="214" fill="#34d399" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="600" text-anchor="start">200 OK</text><text x="810" y="236" fill="#34d399" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" text-anchor="start">scope: "read write"</text><path d="M712 150 L785 165" stroke="#34d399" stroke-width="1.8" marker-end="url(#f-34d399)"/><path d="M712 250 L785 215" stroke="#fb7185" stroke-width="1.8" marker-end="url(#f-fb7185)"/><text x="575" y="335" fill="#8b9bb4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">The key cannot tell the app from the attacker: both of them have it.</text></svg>