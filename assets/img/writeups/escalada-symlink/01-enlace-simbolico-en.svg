<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 385" width="1150" height="385" role="img"><rect width="1150" height="385" fill="#0d1526"/><defs><marker id="f-8b9bb4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b9bb4"/></marker><marker id="f-fb7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb7185"/></marker><marker id="f-34d399" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34d399"/></marker><marker id="f-60a5fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/></marker><marker id="f-fbbf24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker></defs><text x="40" y="40" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15" font-weight="600" text-anchor="start">Root writes wherever you tell it to</text><rect x="40" y="76" width="290" height="70" rx="11" fill="#111a2d" stroke="#fbbf24" stroke-opacity=".6"/><text x="185" y="108" fill="#fbbf24" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">YOU (ordinary user)</text><text x="185" y="130" fill="#8b9bb4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">you plant a link at the predictable path</text><rect x="820" y="76" width="290" height="70" rx="11" fill="#111a2d" stroke="#60a5fa" stroke-opacity=".6"/><text x="965" y="108" fill="#60a5fa" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">THE ROOT PROCESS</text><text x="965" y="130" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" text-anchor="middle">touch + chmod 666</text><rect x="400" y="170" width="350" height="56" rx="11" fill="#0d1526" stroke="#22304d" stroke-opacity=".6"/><text x="575" y="194" fill="#dbe4f3" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" text-anchor="middle">~/.client/logs/log-&lt;time&gt;.log</text><text x="575" y="214" fill="#fbbf24" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" text-anchor="middle">→ symbolic link</text><path d="M185 146 L420 180" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#f-fbbf24)"/><path d="M900 146 L730 180" stroke="#60a5fa" stroke-width="1.8" marker-end="url(#f-60a5fa)"/><text x="898" y="172" fill="#8b9bb4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">root writes here...</text><path d="M575 226 L575 266" stroke="#fb7185" stroke-width="2" marker-end="url(#f-fb7185)"/><text x="595" y="252" fill="#fb7185" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="start">...but the link points there</text><rect x="370" y="266" width="410" height="60" rx="11" fill="#2a1220" stroke="#fb7185" stroke-opacity=".6"/><text x="575" y="292" fill="#fb7185" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13" font-weight="600" text-anchor="middle">/etc/profile.d/x.sh</text><text x="575" y="313" fill="#8b9bb4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">a root-owned file, writable by anyone</text><text x="575" y="360" fill="#8b9bb4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">The folder is yours, so the kernel's /tmp protection does not apply.</text></svg>