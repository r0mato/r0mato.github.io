<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="1120" height="420" role="img"><rect width="1120" height="420" fill="#0d1526"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7a8aa3"/></marker></defs><text x="40" y="44" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15" font-weight="600">Cadena de confianza rota</text><rect x="40" y="74" width="210" height="82" rx="10" fill="#111a2d" stroke="#fbbf24" stroke-opacity="0.55"/><text x="145.0" y="111.0" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">Atacante</text><text x="145.0" y="131.0" fill="#7a8aa3" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11.5" text-anchor="middle">sesión válida · tenant 4417</text><path d="M250 115 L430 115" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#a)"/><text x="340.0" y="106.0" fill="#fbbf24" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11.5" text-anchor="middle">X-Org-Context: 8831</text><rect x="430" y="74" width="230" height="82" rx="10" fill="#111a2d" stroke="#60a5fa" stroke-opacity="0.55"/><text x="545.0" y="111.0" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">Gateway / Edge</text><text x="545.0" y="131.0" fill="#7a8aa3" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11.5" text-anchor="middle">valida la FIRMA del token</text><path d="M660 115 L830 115" stroke="#7a8aa3" stroke-width="1.8" marker-end="url(#a)"/><text x="745.0" y="106.0" fill="#7a8aa3" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11.5" text-anchor="middle">confía en la cabecera</text><rect x="830" y="74" width="250" height="82" rx="10" fill="#111a2d" stroke="#fb7185" stroke-opacity="0.55"/><text x="955.0" y="111.0" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">Servicio de facturación</text><text x="955.0" y="131.0" fill="#7a8aa3" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11.5" text-anchor="middle">no revalida el tenant</text><path d="M955 156 L955 220" stroke="#7a8aa3" stroke-width="1.8" marker-end="url(#a)"/><text x="955.0" y="179.0" fill="#7a8aa3" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11.5" text-anchor="middle">consulta por org_id</text><rect x="830" y="220" width="250" height="76" rx="10" fill="#111a2d" stroke="#fb7185" stroke-opacity="0.55"/><text x="955.0" y="254.0" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">Base de datos</text><text x="955.0" y="274.0" fill="#7a8aa3" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11.5" text-anchor="middle">devuelve el tenant 8831</text><path d="M830 258 H560" stroke="#fb7185" stroke-width="1.8" marker-end="url(#a)" stroke-opacity="0.8"/><text x="695" y="249" fill="#fb7185" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11.5" text-anchor="middle">PII + importes + IBAN</text><rect x="310" y="220" width="250" height="76" rx="10" fill="#111a2d" stroke="#fb7185" stroke-opacity="0.55"/><text x="435.0" y="254.0" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">Respuesta al atacante</text><text x="435.0" y="274.0" fill="#7a8aa3" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11.5" text-anchor="middle">200 OK · datos ajenos</text><rect x="40" y="330" width="1040" height="52" rx="8" fill="#111a2d" stroke="#22304d"/><text x="60" y="352" fill="#7a8aa3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5">Suposición del desarrollador: «si el gateway aceptó el token, el contexto de organización ya viene validado».</text><text x="60" y="371" fill="#34d399" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5">Realidad: el gateway solo verifica la firma JWT; el servicio interno toma el tenant de una cabecera controlada por el cliente.</text></svg>