<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 385" width="1150" height="385" role="img"><rect width="1150" height="385" fill="#0d1526"/><defs><marker id="f-8b9bb4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b9bb4"/></marker><marker id="f-fb7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb7185"/></marker><marker id="f-34d399" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34d399"/></marker><marker id="f-60a5fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/></marker><marker id="f-fbbf24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker></defs><text x="40" y="40" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15" font-weight="600" text-anchor="start">How one quote turns a path into an order</text><rect x="40" y="72" width="1070" height="110" rx="11" fill="#111a2d" stroke="#34d399" stroke-opacity=".6"/><text x="62" y="100" fill="#34d399" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="600" text-anchor="start">WHAT THE PROGRAM EXPECTS</text><rect x="62" y="114" width="1026" height="44" rx="7" fill="#0d1526" stroke="#22304d"/><text x="80" y="142" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start">codesign -d '</text><rect x="190" y="124" width="136" height="26" rx="4" fill="#0c2520" stroke="#34d399" stroke-opacity=".5"/><text x="196" y="142" fill="#34d399" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start">/tmp/mi-app</text><text x="328" y="142" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start">' 2&gt;&amp;1</text><text x="416" y="142" fill="#34d399" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="start">← literal text</text><rect x="40" y="200" width="1070" height="130" rx="11" fill="#111a2d" stroke="#fb7185" stroke-opacity=".6"/><text x="62" y="228" fill="#fb7185" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="600" text-anchor="start">WHAT IT GETS</text><rect x="62" y="242" width="1026" height="44" rx="7" fill="#2a1220" stroke="#fb7185" stroke-opacity=".4"/><text x="80" y="270" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start">codesign -d '</text><text x="188" y="270" fill="#dbe4f3" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start">/tmp/p</text><text x="246" y="270" fill="#fbbf24" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="17" font-weight="700" text-anchor="start">'</text><rect x="254" y="252" width="150" height="26" rx="4" fill="#2a1220" stroke="#fb7185"/><text x="260" y="270" fill="#fb7185" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="14" font-weight="600" text-anchor="start">$(sh /tmp/x.sh)</text><text x="407" y="270" fill="#fbbf24" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="17" font-weight="700" text-anchor="start">'</text><text x="418" y="270" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" text-anchor="start">' 2&gt;&amp;1</text><text x="80" y="308" fill="#fb7185" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start">the quote CLOSES, and what follows runs</text><text x="840" y="308" fill="#fb7185" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="start">↑ executes</text><text x="575" y="362" fill="#8b9bb4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">The injection travels in no field: it is the name of a folder.</text></svg>