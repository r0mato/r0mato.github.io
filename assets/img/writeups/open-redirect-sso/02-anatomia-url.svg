<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 365" width="1150" height="365" role="img"><rect width="1150" height="365" fill="#0d1526"/><defs><marker id="f-8b9bb4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b9bb4"/></marker><marker id="f-fb7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb7185"/></marker><marker id="f-34d399" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34d399"/></marker><marker id="f-60a5fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/></marker><marker id="f-fbbf24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker></defs><text x="40" y="40" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15" font-weight="600" text-anchor="start">Dónde corta el navegador, y dónde mira la comprobación</text><rect x="40" y="72" width="1070" height="86" rx="11" fill="#0d1526" stroke="#22304d" stroke-opacity=".6"/><text x="70" y="122" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" text-anchor="start">https://</text><rect x="158" y="92" width="150" height="40" rx="6" fill="#2a1220" stroke="#fb7185" stroke-opacity=".6"/><text x="166" y="122" fill="#fb7185" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="20" font-weight="600" text-anchor="start">atacante.com</text><text x="316" y="122" fill="#fbbf24" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="22" font-weight="700" text-anchor="start">/</text><rect x="324" y="92" width="130" height="40" rx="6" fill="#16233d" stroke="#60a5fa" stroke-opacity=".5"/><text x="332" y="122" fill="#60a5fa" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" text-anchor="start">.marca.com</text><path d="M152 150 L310 150" stroke="#fb7185" stroke-width="2"/><text x="152" y="174" fill="#fb7185" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="600" text-anchor="start">SERVIDOR DE DESTINO</text><path d="M316 150 L458 150" stroke="#60a5fa" stroke-width="2"/><text x="316" y="174" fill="#60a5fa" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="600" text-anchor="start">RUTA (dentro de ese servidor)</text><rect x="40" y="200" width="1070" height="48" rx="11" fill="#111a2d" stroke="#22304d" stroke-opacity=".6"/><text x="62" y="229" fill="#34d399" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15" font-weight="700" text-anchor="start">✓</text><text x="88" y="229" fill="#8b9bb4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start">la comprobación busca «.marca.com» en todo el texto → lo encuentra</text><rect x="40" y="258" width="1070" height="48" rx="11" fill="#2a1220" stroke="#fb7185" stroke-opacity=".6"/><text x="62" y="287" fill="#fb7185" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15" font-weight="700" text-anchor="start">✗</text><text x="88" y="287" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start">el navegador solo mira hasta la primera barra → va al atacante</text><text x="575" y="340" fill="#8b9bb4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">Una URL no es texto: es una estructura. Compararla como texto es el fallo.</text></svg>