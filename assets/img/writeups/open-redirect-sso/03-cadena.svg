<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 272" width="1150" height="272" role="img"><rect width="1150" height="272" fill="#0d1526"/><defs><marker id="f-8b9bb4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b9bb4"/></marker><marker id="f-fb7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb7185"/></marker><marker id="f-34d399" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34d399"/></marker><marker id="f-60a5fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/></marker><marker id="f-fbbf24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker></defs><text x="40" y="42" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15" font-weight="600" text-anchor="start">Un clic, y la sesión cambia de dueño</text><rect x="40" y="76" width="200" height="132" rx="11" fill="#111a2d" stroke="#60a5fa" stroke-opacity=".6"/><circle cx="62" cy="98" r="12" fill="#60a5fa" fill-opacity=".18" stroke="#60a5fa" stroke-opacity=".5"/><text x="62" y="103" fill="#60a5fa" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">1</text><text x="56" y="134" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="start">La víctima abre un</text><text x="56" y="151" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="start">enlace</text><text x="56" y="176" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10" font-weight="400" text-anchor="start">dominio visible: el del</text><text x="56" y="190" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10" font-weight="400" text-anchor="start">fabricante</text><path d="M240 142 L258 142" stroke="#8b9bb4" stroke-width="1.6" marker-end="url(#f-8b9bb4)"/><rect x="258" y="76" width="200" height="132" rx="11" fill="#111a2d" stroke="#60a5fa" stroke-opacity=".6"/><circle cx="280" cy="98" r="12" fill="#60a5fa" fill-opacity=".18" stroke="#60a5fa" stroke-opacity=".5"/><text x="280" y="103" fill="#60a5fa" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">2</text><text x="274" y="134" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="start">El SSO ve su sesión</text><text x="274" y="151" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="start">abierta</text><text x="274" y="176" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10" font-weight="400" text-anchor="start">no pide contraseña: emite el</text><text x="274" y="190" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10" font-weight="400" text-anchor="start">ticket</text><path d="M458 142 L476 142" stroke="#8b9bb4" stroke-width="1.6" marker-end="url(#f-8b9bb4)"/><rect x="476" y="76" width="200" height="132" rx="11" fill="#111a2d" stroke="#fbbf24" stroke-opacity=".6"/><circle cx="498" cy="98" r="12" fill="#fbbf24" fill-opacity=".18" stroke="#fbbf24" stroke-opacity=".5"/><text x="498" y="103" fill="#fbbf24" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">3</text><text x="492" y="134" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Redirección al dominio</text><text x="492" y="151" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="start">del atacante</text><text x="492" y="176" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10" font-weight="400" text-anchor="start">el ticket viaja en la URL</text><path d="M676 142 L694 142" stroke="#8b9bb4" stroke-width="1.6" marker-end="url(#f-8b9bb4)"/><rect x="694" y="76" width="200" height="132" rx="11" fill="#111a2d" stroke="#fb7185" stroke-opacity=".6"/><circle cx="716" cy="98" r="12" fill="#fb7185" fill-opacity=".18" stroke="#fb7185" stroke-opacity=".5"/><text x="716" y="103" fill="#fb7185" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">4</text><text x="710" y="134" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="start">El atacante lo lee en</text><text x="710" y="151" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="start">su propio log</text><text x="710" y="176" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10" font-weight="400" text-anchor="start">sin tocar a la víctima otra</text><text x="710" y="190" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10" font-weight="400" text-anchor="start">vez</text><path d="M894 142 L912 142" stroke="#8b9bb4" stroke-width="1.6" marker-end="url(#f-8b9bb4)"/><rect x="912" y="76" width="200" height="132" rx="11" fill="#111a2d" stroke="#fb7185" stroke-opacity=".6"/><circle cx="934" cy="98" r="12" fill="#fb7185" fill-opacity=".18" stroke="#fb7185" stroke-opacity=".5"/><text x="934" y="103" fill="#fb7185" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">5</text><text x="928" y="134" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Canjea el ticket desde</text><text x="928" y="151" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="start">cero</text><text x="928" y="176" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10" font-weight="400" text-anchor="start">sin cookie, sin contraseña →</text><text x="928" y="190" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10" font-weight="400" text-anchor="start">sesión completa</text><text x="575" y="246" fill="#8b9bb4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">El fallo no es la redirección: es que la redirección se lleva una credencial.</text></svg>