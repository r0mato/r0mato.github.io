 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">Both read 0 and both write: 2 where 1 fit</text><text x="470" y="336" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" text-anchor="middle">plan limit: 1 device</text><text x="470" y="362" fill="#8b9bb4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">The bug is not the check, which is correct. It is the gap the check leaves behind.</text></svg>