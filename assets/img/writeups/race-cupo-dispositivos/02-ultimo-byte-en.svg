<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 488" width="940" height="488" role="img"><rect width="940" height="488" fill="#0d1526"/><defs><marker id="f-8b9bb4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b9bb4"/></marker><marker id="f-fb7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb7185"/></marker><marker id="f-34d399" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34d399"/></marker><marker id="f-60a5fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/></marker><marker id="f-fbbf24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker></defs><text x="470" y="40" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" font-weight="650" text-anchor="middle">“At the same time” is not “very fast”</text><rect x="30" y="62" width="880" height="122" rx="12" fill="#0b1220" stroke="#22304d" stroke-opacity=".5"/><text x="52" y="88" fill="#fb7185" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="600" text-anchor="start">Sent back to back</text><text x="52" y="116" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" text-anchor="start">connection 1</text><rect x="150" y="104" width="128" height="16" rx="4" fill="#60a5fa" fill-opacity=".30"/><rect x="278" y="104" width="7" height="16" rx="2" fill="#fb7185"/><text x="52" y="140" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" text-anchor="start">connection 2</text><rect x="300" y="128" width="128" height="16" rx="4" fill="#60a5fa" fill-opacity=".30"/><rect x="428" y="128" width="7" height="16" rx="2" fill="#fb7185"/><text x="52" y="164" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" text-anchor="start">connection 3</text><rect x="450" y="152" width="128" height="16" rx="4" fill="#60a5fa" fill-opacity=".30"/><rect x="578" y="152" width="7" height="16" rx="2" fill="#fb7185"/><text x="888" y="172" fill="#fb7185" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" text-anchor="end">arrive spread out</text><text x="470" y="208" fill="#8b9bb4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle">Each one leaves when the previous finishes. Between the first and the last there are milliseconds of</text><text x="470" y="225" fill="#8b9bb4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle">network: plenty of time for the counter to already be up.</text><rect x="30" y="254" width="880" height="138" rx="12" fill="#0b1220" stroke="#22304d" stroke-opacity=".5"/><text x="52" y="280" fill="#34d399" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="600" text-anchor="start">Last-byte synchronised</text><text x="52" y="308" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" text-anchor="start">connection 1</text><rect x="150" y="296" width="520" height="16" rx="4" fill="#60a5fa" fill-opacity=".30"/><rect x="676" y="296" width="7" height="16" rx="2" fill="#34d399"/><text x="52" y="332" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" text-anchor="start">connection 2</text><rect x="150" y="320" width="520" height="16" rx="4" fill="#60a5fa" fill-opacity=".30"/><rect x="676" y="320" width="7" height="16" rx="2" fill="#34d399"/><text x="52" y="356" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" text-anchor="start">connection 3</text><rect x="150" y="344" width="520" height="16" rx="4" fill="#60a5fa" fill-opacity=".30"/><rect x="676" y="344" width="7" height="16" rx="2" fill="#34d399"/><text x="410" y="296" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" text-anchor="middle">whole request minus 1 byte</text><path d="M694 290 L694 362" stroke="#34d399" stroke-width="1.6" stroke-dasharray="4 3"/><text x="704" y="296" fill="#34d399" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" text-anchor="start">1 byte</text><text x="888" y="380" fill="#34d399" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" text-anchor="end">arrive inside the same window</text><text x="470" y="416" fill="#8b9bb4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle">Open N connections and send the whole request MINUS its final byte. The server cannot process</text><text x="470" y="433" fill="#8b9bb4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle">anything yet. Then release the N final bytes together, with the latency already paid.</text><text x="470" y="468" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="500" text-anchor="middle">The latency is paid BEFORE the race starts, not during it.</text></svg>