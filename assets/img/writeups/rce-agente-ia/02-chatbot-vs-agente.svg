<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 400" width="1150" height="400" role="img"><rect width="1150" height="400" fill="#0d1526"/><defs><marker id="f-8b9bb4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b9bb4"/></marker><marker id="f-fb7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb7185"/></marker><marker id="f-34d399" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34d399"/></marker><marker id="f-60a5fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/></marker><marker id="f-fbbf24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker></defs><text x="40" y="40" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15" font-weight="600" text-anchor="start">La diferencia entre un chatbot y un agente</text><rect x="40" y="72" width="420" height="150" rx="11" fill="#111a2d" stroke="#34d399" stroke-opacity=".6"/><text x="60" y="102" fill="#34d399" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" text-anchor="start">CHATBOT</text><text x="60" y="132" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start">Texto entra, texto sale.</text><text x="60" y="154" fill="#8b9bb4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start">No puede tocar nada.</text><rect x="60" y="172" width="380" height="32" rx="6" fill="#0d1526" stroke="#22304d"/><text x="76" y="193" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" text-anchor="start">usuario → modelo → respuesta</text><rect x="500" y="72" width="610" height="275" rx="11" fill="#111a2d" stroke="#fb7185" stroke-opacity=".6"/><text x="520" y="102" fill="#fb7185" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" text-anchor="start">AGENTE</text><text x="520" y="132" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start">Texto entra, y el modelo</text><text x="520" y="154" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start">DECIDE qué herramienta usar.</text><rect x="520" y="178" width="570" height="32" rx="6" fill="#0d1526" stroke="#22304d" stroke-opacity=".6"/><text x="538" y="199" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" text-anchor="start">buscar en la base de datos</text><rect x="520" y="218" width="570" height="32" rx="6" fill="#0d1526" stroke="#22304d" stroke-opacity=".6"/><text x="538" y="239" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" text-anchor="start">llamar a una API</text><rect x="520" y="258" width="570" height="32" rx="6" fill="#2a1220" stroke="#fb7185" stroke-opacity=".6"/><text x="538" y="279" fill="#fb7185" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="600" text-anchor="start">run_ipython_cell</text><text x="1074" y="279" fill="#fb7185" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="end">← ejecuta código en el servidor</text><rect x="520" y="298" width="570" height="32" rx="6" fill="#0d1526" stroke="#22304d" stroke-opacity=".6"/><text x="538" y="319" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" text-anchor="start">enviar un correo</text><text x="575" y="378" fill="#8b9bb4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">El fallo no está en lo que el modelo dice: está en lo que le han dejado hacer.</text></svg>