<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 345" width="1150" height="345" role="img"><rect width="1150" height="345" fill="#0d1526"/><defs><marker id="f-8b9bb4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b9bb4"/></marker><marker id="f-fb7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb7185"/></marker><marker id="f-34d399" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34d399"/></marker><marker id="f-60a5fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/></marker><marker id="f-fbbf24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker></defs><text x="40" y="42" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15" font-weight="600" text-anchor="start">La misma orden, dos formas de ejecutarla</text><text x="40" y="76" fill="#fbbf24" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" text-anchor="start">8.8.8.8; touch /tmp/x</text><path d="M250 71 L300 71" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#f-fbbf24)"/><rect x="330" y="56" width="370" height="230" rx="11" fill="#111a2d" stroke="#34d399" stroke-opacity=".6"/><text x="350" y="84" fill="#34d399" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" text-anchor="start">Lista de argumentos</text><text x="350" y="104" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" text-anchor="start">shell=False</text><rect x="350" y="120" width="330" height="54" rx="7" fill="#0d1526" stroke="#22304d"/><text x="364" y="142" fill="#dbe4f3" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" text-anchor="start">["ping", "-c1", dato]</text><text x="364" y="161" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" text-anchor="start">→ /usr/bin/ping</text><text x="350" y="200" fill="#8b9bb4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start">el programa `ping` recibe un argumento raro,</text><text x="350" y="218" fill="#8b9bb4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start">falla y ya está</text><text x="350" y="266" fill="#34d399" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Los datos siguen siendo datos</text><rect x="740" y="56" width="370" height="230" rx="11" fill="#111a2d" stroke="#fb7185" stroke-opacity=".6"/><text x="760" y="84" fill="#fb7185" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" text-anchor="start">Una frase entera</text><text x="760" y="104" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" text-anchor="start">shell=True</text><rect x="760" y="120" width="330" height="54" rx="7" fill="#2a1220" stroke="#fb7185" stroke-opacity=".5"/><text x="774" y="142" fill="#dbe4f3" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" text-anchor="start">f"ping -c1 {dato}"</text><text x="774" y="161" fill="#fb7185" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" text-anchor="start">→ /bin/sh -c  …</text><text x="760" y="200" fill="#8b9bb4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start">la shell ve el «;» y ejecuta DOS órdenes</text><text x="760" y="266" fill="#fb7185" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Los datos se han vuelto código</text><text x="575" y="320" fill="#8b9bb4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">Si una parte de esa frase viene de la red, quien la escribe es el servidor.</text></svg>