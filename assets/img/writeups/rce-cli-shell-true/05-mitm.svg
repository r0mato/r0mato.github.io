<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 408" width="1150" height="408" role="img"><rect width="1150" height="408" fill="#0d1526"/><defs><marker id="f-8b9bb4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b9bb4"/></marker><marker id="f-fb7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb7185"/></marker><marker id="f-34d399" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34d399"/></marker><marker id="f-60a5fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/></marker><marker id="f-fbbf24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker></defs><text x="40" y="42" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15" font-weight="600" text-anchor="start">Solo se envenena una petición; el resto pasa de largo</text><rect x="40" y="80" width="230" height="64" rx="11" fill="#111a2d" stroke="#60a5fa" stroke-opacity=".6"/><text x="155" y="110" fill="#60a5fa" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">CLIENTE DE LA VÍCTIMA</text><text x="155" y="130" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" text-anchor="middle">sudo cliente --connect</text><rect x="460" y="80" width="230" height="64" rx="11" fill="#111a2d" stroke="#fb7185" stroke-opacity=".6"/><text x="575" y="110" fill="#fb7185" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">PROXY DEL ATACANTE</text><text x="575" y="130" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" text-anchor="middle">CA propia + /etc/hosts</text><rect x="880" y="80" width="230" height="64" rx="11" fill="#111a2d" stroke="#34d399" stroke-opacity=".6"/><text x="995" y="110" fill="#34d399" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">SERVIDOR REAL</text><path d="M270 112 L455 112" stroke="#60a5fa" stroke-width="1.8" marker-end="url(#f-60a5fa)"/><path d="M690 112 L875 112" stroke="#34d399" stroke-width="1.8" marker-end="url(#f-34d399)"/><rect x="40" y="176" width="1070" height="38" rx="8" fill="#111a2d" stroke="#8b9bb4" stroke-opacity="0.35"/><text x="62" y="201" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" text-anchor="start">POST /login</text><text x="1088" y="201" fill="#8b9bb4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="end">se reenvía tal cual</text><rect x="40" y="222" width="1070" height="38" rx="8" fill="#111a2d" stroke="#8b9bb4" stroke-opacity="0.35"/><text x="62" y="247" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" text-anchor="start">GET /servers</text><text x="1088" y="247" fill="#8b9bb4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="end">se reenvía tal cual</text><rect x="40" y="268" width="1070" height="38" rx="8" fill="#2a1220" stroke="#fb7185" stroke-opacity="0.7"/><text x="62" y="293" fill="#dbe4f3" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="600" text-anchor="start">GET /servers/&lt;id&gt;/configs</text><text x="1088" y="293" fill="#fb7185" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="end">respuesta sustituida</text><rect x="40" y="314" width="1070" height="38" rx="8" fill="#111a2d" stroke="#8b9bb4" stroke-opacity="0.35"/><text x="62" y="339" fill="#8b9bb4" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" text-anchor="start">GET /certs.zip</text><text x="1088" y="339" fill="#8b9bb4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="end">se reenvía tal cual</text><text x="575" y="384" fill="#8b9bb4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">La aplicación no nota nada raro: todo funciona salvo el campo que importa.</text></svg>