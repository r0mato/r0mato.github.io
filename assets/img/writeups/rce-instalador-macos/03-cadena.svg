<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" width="1120" height="500" role="img"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7a8aa3"/></marker></defs><rect width="1120" height="500" fill="#0d1526"/><text x="40" y="42" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15" font-weight="600">Nadie valida el valor en todo el recorrido</text><rect x="40" y="70" width="290" height="82" rx="11" fill="#111a2d" stroke="#fbbf24" stroke-opacity=".6"/><circle cx="60" cy="90" r="11" fill="#fbbf24" fill-opacity=".18" stroke="#fbbf24" stroke-opacity=".5"/><text x="60" y="94" fill="#fbbf24" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">1</text><text x="185.0" y="113.0" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" text-anchor="middle">Atacante</text><text x="185.0" y="133.0" fill="#7a8aa3" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" text-anchor="middle">sin cuenta · sin token</text><path d="M330 111 L470 111" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#a)"/><text x="400.0" y="101.0" fill="#fbbf24" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" text-anchor="middle">POST  installCount</text><rect x="470" y="70" width="300" height="82" rx="11" fill="#111a2d" stroke="#fb7185" stroke-opacity=".6"/><circle cx="490" cy="90" r="11" fill="#fb7185" fill-opacity=".18" stroke="#fb7185" stroke-opacity=".5"/><text x="490" y="94" fill="#fb7185" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">2</text><text x="620.0" y="113.0" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" text-anchor="middle">Servidor de feedback</text><text x="620.0" y="133.0" fill="#7a8aa3" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" text-anchor="middle">guarda el texto tal cual</text><rect x="830" y="70" width="250" height="82" rx="11" fill="#111a2d" stroke="#60a5fa" stroke-opacity=".6"/><circle cx="850" cy="90" r="11" fill="#60a5fa" fill-opacity=".18" stroke="#60a5fa" stroke-opacity=".5"/><text x="850" y="94" fill="#60a5fa" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">3</text><text x="955.0" y="113.0" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" text-anchor="middle">Víctima</text><text x="955.0" y="133.0" fill="#7a8aa3" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" text-anchor="middle">instala la app</text><path d="M955 152 L955 215" stroke="#7a8aa3" stroke-width="1.8" marker-end="url(#a)"/><text x="955" y="186" fill="#7a8aa3" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" text-anchor="middle">ejecuta postinstall</text><rect x="700" y="215" width="380" height="82" rx="11" fill="#111a2d" stroke="#60a5fa" stroke-opacity=".6"/><circle cx="720" cy="235" r="11" fill="#60a5fa" fill-opacity=".18" stroke="#60a5fa" stroke-opacity=".5"/><text x="720" y="239" fill="#60a5fa" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">4</text><text x="890.0" y="258.0" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" text-anchor="middle">Script postinstall  (root)</text><text x="890.0" y="278.0" fill="#7a8aa3" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" text-anchor="middle">GET /v2/feedback/&lt;install_id&gt;</text><path d="M700 256 L480 256" stroke="#fb7185" stroke-width="1.8" marker-end="url(#a)"/><text x="590" y="246" fill="#fb7185" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" text-anchor="middle">devuelve el texto byte a byte</text><rect x="140" y="215" width="340" height="82" rx="11" fill="#111a2d" stroke="#fb7185" stroke-opacity=".6"/><circle cx="160" cy="235" r="11" fill="#fb7185" fill-opacity=".18" stroke="#fb7185" stroke-opacity=".5"/><text x="160" y="239" fill="#fb7185" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">5</text><text x="310.0" y="258.0" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" text-anchor="middle">install_count = ...</text><text x="310.0" y="278.0" fill="#7a8aa3" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" text-anchor="middle">quita solo las comillas</text><path d="M310 297 L310 350" stroke="#fb7185" stroke-width="1.8" marker-end="url(#a)"/><rect x="140" y="350" width="340" height="76" rx="11" fill="#2a1220" stroke="#fb7185" stroke-opacity=".7"/><text x="310" y="380" fill="#fb7185" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13" font-weight="600" text-anchor="middle">$((install_count + 1))</text><text x="310" y="403" fill="#dbe4f3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" text-anchor="middle">evalúa → ejecuta como root</text><rect x="560" y="350" width="520" height="76" rx="10" fill="#111a2d" stroke="#22304d"/><text x="580" y="376" fill="#7a8aa3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5">El instalador termina siempre con código 0 (trap finish EXIT),</text><text x="580" y="396" fill="#34d399" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5">así que la víctima ve una instalación correcta. Cero indicios.</text><text x="560.0" y="470" fill="#7a8aa3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" text-anchor="middle">Todos los nombres de host, campos y versiones están anonimizados.</text></svg>